<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyber Survivor: Neon Defense</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: radial-gradient(circle at center, #0f172a, #020617);
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }
    #game-container {
      position: relative;
      box-shadow: 0 0 50px rgba(56, 189, 248, 0.25);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    canvas {
      display: block;
      background: #020617;
      cursor: crosshair;
    }
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .hud {
      position: absolute;
      top: 16px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      font-weight: 600;
      text-shadow: 0 0 8px rgba(0,0,0,0.8);
    }
    .hud-left {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .bar-container {
      width: 200px;
      height: 16px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }
    .hp-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ef4444, #f87171);
      transition: width 0.15s ease-out;
    }
    .exp-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      transition: width 0.1s ease-out;
    }
    .hud-center {
      text-align: center;
      font-size: 24px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 2px;
    }
    .hud-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }
    /* Modal Screen Styles */
    .overlay-screen {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
      z-index: 100;
      transition: opacity 0.2s ease;
    }
    .overlay-screen.hidden {
      display: none;
    }
    h1 {
      font-size: 44px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #38bdf8, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 3px;
    }
    p {
      color: #94a3b8;
      margin-bottom: 24px;
      font-size: 15px;
      line-height: 1.6;
      text-align: center;
    }
    .btn {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      color: white;
      border: none;
      padding: 12px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(14, 165, 233, 0.4);
      transition: all 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 0 30px rgba(14, 165, 233, 0.7);
    }
    /* Upgrade Cards */
    .cards-container {
      display: flex;
      gap: 20px;
      margin-top: 15px;
    }
    .card {
      width: 220px;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .card:hover {
      border-color: #38bdf8;
      transform: translateY(-6px);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.3);
      background: #1e293b;
    }
    .card-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 18px;
      font-weight: bold;
      color: #f1f5f9;
      margin-bottom: 8px;
    }
    .card-desc {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.4;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="900" height="600"></canvas>
    <div id="ui-layer">
      <div class="hud">
        <div class="hud-left">
          <div style="font-size: 12px; color: #f87171;">HP <span id="hp-text">100/100</span></div>
          <div class="bar-container">
            <div id="hp-bar" class="hp-bar"></div>
          </div>
          <div style="font-size: 12px; color: #38bdf8; margin-top: 2px;">EXP (LV <span id="lv-text">1</span>)</div>
          <div class="bar-container" style="height: 8px;">
            <div id="exp-bar" class="exp-bar"></div>
          </div>
        </div>
        <div class="hud-center">
          <span id="score-text">0</span>
        </div>
        <div class="hud-right">
          <div>처치 수: <span id="kills-text" style="color: #4ade80;">0</span></div>
          <div>시간: <span id="time-text" style="color: #cbd5e1;">00:00</span></div>
        </div>
      </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="overlay-screen">
      <h1>Cyber Survivor</h1>
      <p>
        조작키: <b>W, A, S, D</b> 또는 <b>방향키</b> 이동<br/>
        사격: <b>마우스 조준 & 자동 발사</b> (또는 클릭 발사)<br/>
        적을 처치하고 보석을 먹어 레벨업 & 나만의 빌드를 완성하세요!
      </p>
      <button id="start-btn" class="btn">게임 시작</button>
    </div>

    <!-- Upgrade Screen -->
    <div id="upgrade-screen" class="overlay-screen hidden">
      <h1 style="font-size: 32px; color: #f59e0b;">LEVEL UP!</h1>
      <p style="margin-bottom: 10px;">능력치를 강화할 업그레이드를 선택하세요.</p>
      <div id="upgrade-cards" class="cards-container"></div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="overlay-screen hidden">
      <h1 style="color: #ef4444;">GAME OVER</h1>
      <p id="gameover-stats" style="font-size: 16px; color: #e2e8f0;"></p>
      <button id="restart-btn" class="btn">다시 도전하기</button>
    </div>
  </div>

  <script>
    // Audio synthesis (Web Audio API)
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      },
      playShoot() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(450, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
      },
      playHit() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      },
      playGem() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(580, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(900, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
      },
      playLevelUp() {
        if (!this.ctx) return;
        [440, 554, 659, 880].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          const start = this.ctx.currentTime + idx * 0.07;
          gain.gain.setValueAtTime(0.15, start);
          gain.gain.exponentialRampToValueAtTime(0.01, start + 0.15);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(start);
          osc.stop(start + 0.15);
        });
      }
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI elements
    const hpBar = document.getElementById('hp-bar');
    const hpText = document.getElementById('hp-text');
    const expBar = document.getElementById('exp-bar');
    const lvText = document.getElementById('lv-text');
    const scoreText = document.getElementById('score-text');
    const killsText = document.getElementById('kills-text');
    const timeText = document.getElementById('time-text');
    const startScreen = document.getElementById('start-screen');
    const upgradeScreen = document.getElementById('upgrade-screen');
    const upgradeCards = document.getElementById('upgrade-cards');
    const gameoverScreen = document.getElementById('gameover-screen');
    const gameoverStats = document.getElementById('gameover-stats');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    // Game state
    let gameState = 'START'; // START, PLAYING, UPGRADE, GAMEOVER
    let score = 0;
    let kills = 0;
    let gameTimer = 0;
    let lastTime = 0;

    // Keys
    const keys = {};
    const mouse = { x: canvas.width / 2, y: canvas.height / 2 };

    window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;
    });

    // Player
    const player = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 16,
      color: '#38bdf8',
      speed: 3.2,
      maxHp: 100,
      hp: 100,
      invulnerableTimer: 0, // 피격 무적 시간
      level: 1,
      exp: 0,
      nextExp: 20,
      fireRate: 260, // ms per shot
      lastShotTime: 0,
      bulletDamage: 25,
      bulletSpeed: 9,
      multiShot: 1,
      penetration: 1,
      orbiters: 0,
      magnetRange: 120
    };

    let bullets = [];
    let enemies = [];
    let gems = [];
    let particles = [];
    let floatingTexts = [];

    // All possible upgrades
    const UPGRADES = [
      {
        id: 'multishot',
        name: '멀티 샷',
        desc: '발사하는 탄환 수가 1개 증가하고 부채꼴로 퍼집니다.',
        icon: '💥',
        apply: () => { player.multiShot += 1; }
      },
      {
        id: 'firerate',
        name: '연사 속도 강화',
        desc: '공격 주기가 25% 단축되어 더 빠르게 사격합니다.',
        icon: '⚡',
        apply: () => { player.fireRate = Math.max(80, player.fireRate * 0.75); }
      },
      {
        id: 'damage',
        name: '고위력 플라즈마',
        desc: '탄환 데미지가 40% 증가합니다.',
        icon: '🔥',
        apply: () => { player.bulletDamage = Math.round(player.bulletDamage * 1.4); }
      },
      {
        id: 'speed',
        name: '기동 부스터',
        desc: '이동 속도가 20% 빨라지고 자석 범위가 확장됩니다.',
        icon: '👟',
        apply: () => {
          player.speed += 0.7;
          player.magnetRange += 30;
        }
      },
      {
        id: 'orbit',
        name: '방어 궤도 드론',
        desc: '주변을 회전하며 적에게 피해를 주는 궤도 드론을 추가합니다.',
        icon: '🛸',
        apply: () => { player.orbiters += 1; }
      },
      {
        id: 'heal',
        name: '나노 힐링 & 체력 증강',
        desc: '최대 체력이 30 증가하고 즉시 체력을 50 회복합니다.',
        icon: '💚',
        apply: () => {
          player.maxHp += 30;
          player.hp = Math.min(player.maxHp, player.hp + 50);
        }
      },
      {
        id: 'penetration',
        name: '관통 레이저',
        desc: '탄환이 적을 1회 더 관통합니다.',
        icon: '🎯',
        apply: () => { player.penetration += 1; }
      }
    ];

    function resetGame() {
      player.x = canvas.width / 2;
      player.y = canvas.height / 2;
      player.speed = 3.2;
      player.maxHp = 100;
      player.hp = 100;
      player.invulnerableTimer = 0;
      player.level = 1;
      player.exp = 0;
      player.nextExp = 20;
      player.fireRate = 260;
      player.lastShotTime = 0;
      player.bulletDamage = 25;
      player.bulletSpeed = 9;
      player.multiShot = 1;
      player.penetration = 1;
      player.orbiters = 0;
      player.magnetRange = 120;

      bullets = [];
      enemies = [];
      gems = [];
      particles = [];
      floatingTexts = [];

      score = 0;
      kills = 0;
      gameTimer = 0;
      lastTime = performance.now();
      updateHUD();
    }

    function addFloatingText(x, y, text, color = '#ffffff') {
      floatingTexts.push({ x, y, text, color, life: 1, maxLife: 1 });
    }

    function addExplosion(x, y, color, count = 10) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color,
          radius: Math.random() * 3 + 2,
          life: 1,
          decay: Math.random() * 0.03 + 0.02
        });
      }
    }

    let spawnTimer = 0;
    function spawnEnemies(delta) {
      spawnTimer += delta;
      // Spawn rate scales with time
      const spawnInterval = Math.max(300, 1600 - gameTimer * 15);
      if (spawnTimer > spawnInterval) {
        spawnTimer = 0;
        
        // Pick edge of screen
        let x, y;
        if (Math.random() < 0.5) {
          x = Math.random() < 0.5 ? -20 : canvas.width + 20;
          y = Math.random() * canvas.height;
        } else {
          x = Math.random() * canvas.width;
          y = Math.random() < 0.5 ? -20 : canvas.height + 20;
        }

        // Enemy types
        const types = [
          { type: 'chaser', r: 12, hp: 30 + gameTimer * 0.8, speed: 2.1, color: '#f43f5e', exp: 4, score: 20 },
          { type: 'swarm', r: 8, hp: 15 + gameTimer * 0.5, speed: 3.1, color: '#eab308', exp: 2, score: 10 },
          { type: 'tank', r: 22, hp: 120 + gameTimer * 2.5, speed: 1.1, color: '#8b5cf6', exp: 12, score: 60 }
        ];

        let chosen;
        const r = Math.random();
        if (gameTimer > 35 && r < 0.25) chosen = types[2];
        else if (r < 0.55) chosen = types[0];
        else chosen = types[1];

        enemies.push({
          x, y,
          radius: chosen.r,
          hp: chosen.hp,
          maxHp: chosen.hp,
          speed: chosen.speed,
          color: chosen.color,
          expVal: chosen.exp,
          scoreVal: chosen.score
        });
      }
    }

    function fireBullet() {
      AudioEngine.playShoot();
      const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
      const count = player.multiShot;
      const spread = 0.16;

      for (let i = 0; i < count; i++) {
        const offset = (i - (count - 1) / 2) * spread;
        const a = angle + offset;
        bullets.push({
          x: player.x,
          y: player.y,
          vx: Math.cos(a) * player.bulletSpeed,
          vy: Math.sin(a) * player.bulletSpeed,
          radius: 4,
          damage: player.bulletDamage,
          penetration: player.penetration,
          color: '#38bdf8'
        });
      }
    }

    function showUpgradeScreen() {
      gameState = 'UPGRADE';
      upgradeCards.innerHTML = '';
      AudioEngine.playLevelUp();

      // Random 3 upgrades
      const shuffled = [...UPGRADES].sort(() => 0.5 - Math.random());
      const selected = shuffled.slice(0, 3);

      selected.forEach(up => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-icon">${up.icon}</div>
          <div class="card-title">${up.name}</div>
          <div class="card-desc">${up.desc}</div>
        `;
        card.onclick = () => {
          up.apply();
          upgradeScreen.classList.add('hidden');
          gameState = 'PLAYING';
          lastTime = performance.now();
        };
        upgradeCards.appendChild(card);
      });

      upgradeScreen.classList.remove('hidden');
    }

    function gainExp(amount) {
      player.exp += amount;
      if (player.exp >= player.nextExp) {
        player.exp -= player.nextExp;
        player.level += 1;
        player.nextExp = Math.round(player.nextExp * 1.45 + 10);
        showUpgradeScreen();
      }
      updateHUD();
    }

    function updateHUD() {
      hpBar.style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
      hpText.innerText = `${Math.ceil(player.hp)}/${player.maxHp}`;
      expBar.style.width = Math.min(100, (player.exp / player.nextExp) * 100) + '%';
      lvText.innerText = player.level;
      scoreText.innerText = score.toLocaleString();
      killsText.innerText = kills;

      const mins = Math.floor(gameTimer / 60).toString().padStart(2, '0');
      const secs = Math.floor(gameTimer % 60).toString().padStart(2, '0');
      timeText.innerText = `${mins}:${secs}`;
    }

    function gameOver() {
      gameState = 'GAMEOVER';
      gameoverStats.innerHTML = `
        생존 시간: <b>${Math.floor(gameTimer)}초</b><br/>
        최종 점수: <b>${score.toLocaleString()}</b> 점<br/>
        처치한 적: <b>${kills}</b> 마리<br/>
        도달 레벨: <b>LV ${player.level}</b>
      `;
      gameoverScreen.classList.remove('hidden');
    }

    // Main Game Loop
    function update(delta) {
      if (gameState !== 'PLAYING') return;

      gameTimer += delta / 1000;
      updateHUD();

      // Player Movement
      if (player.invulnerableTimer > 0) {
        player.invulnerableTimer -= delta;
      }

      let dx = 0, dy = 0;
      if (keys['w'] || keys['arrowup']) dy -= 1;
      if (keys['s'] || keys['arrowdown']) dy += 1;
      if (keys['a'] || keys['arrowleft']) dx -= 1;
      if (keys['d'] || keys['arrowright']) dx += 1;

      if (dx !== 0 && dy !== 0) {
        dx *= 0.7071;
        dy *= 0.7071;
      }

      player.x += dx * player.speed;
      player.y += dy * player.speed;

      // Keep within bounds
      player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
      player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

      // Auto shooting
      const now = performance.now();
      if (now - player.lastShotTime > player.fireRate) {
        player.lastShotTime = now;
        fireBullet();
      }

      // Spawning
      spawnEnemies(delta);

      // Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;

        // Offscreen check
        if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
          bullets.splice(i, 1);
          continue;
        }

        // Bullet collisions with enemies
        for (let j = enemies.length - 1; j >= 0; j--) {
          const e = enemies[j];
          const dist = Math.hypot(b.x - e.x, b.y - e.y);
          if (dist < b.radius + e.radius) {
            e.hp -= b.damage;
            AudioEngine.playHit();
            addFloatingText(e.x, e.y - 8, `-${b.damage}`, '#ef4444');
            addExplosion(b.x, b.y, '#38bdf8', 4);

            b.penetration -= 1;
            if (b.penetration <= 0) {
              bullets.splice(i, 1);
              break;
            }
          }
        }
      }

      // Drone Orbiters damage
      if (player.orbiters > 0) {
        const orbitAngle = (now * 0.003);
        const orbitDist = 55;
        for (let k = 0; k < player.orbiters; k++) {
          const a = orbitAngle + (k * (Math.PI * 2 / player.orbiters));
          const ox = player.x + Math.cos(a) * orbitDist;
          const oy = player.y + Math.sin(a) * orbitDist;

          // Check hit
          for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            if (Math.hypot(ox - e.x, oy - e.y) < 14 + e.radius) {
              e.hp -= 1.8; // constant laser/blade damage
              if (Math.random() < 0.1) addExplosion(ox, oy, '#818cf8', 2);
            }
          }
        }
      }

      // Enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];

        // Enemy death
        if (e.hp <= 0) {
          addExplosion(e.x, e.y, e.color, 14);
          score += e.scoreVal;
          kills += 1;

          // Drop EXP Gem
          gems.push({
            x: e.x,
            y: e.y,
            exp: e.expVal,
            radius: 5,
            color: '#38bdf8'
          });

          enemies.splice(i, 1);
          continue;
        }

        // Enemy move towards player
        const angle = Math.atan2(player.y - e.y, player.x - e.x);
        e.x += Math.cos(angle) * e.speed;
        e.y += Math.sin(angle) * e.speed;

        // Collision with player
        const dist = Math.hypot(player.x - e.x, player.y - e.y);
        if (dist < player.radius + e.radius) {
          if (player.invulnerableTimer <= 0) {
            const damage = 15; // 1회 피격 고정 데미지
            player.hp -= damage;
            player.invulnerableTimer = 800; // 0.8초 무적 시간
            AudioEngine.playHit();
            addFloatingText(player.x, player.y - 12, `-${damage}`, '#ff4444');
            addExplosion(player.x, player.y, '#ef4444', 8);

            // 피격 시 넉백 (적과 반대 방향)
            const knockAngle = Math.atan2(player.y - e.y, player.x - e.x);
            player.x += Math.cos(knockAngle) * 20;
            player.y += Math.sin(knockAngle) * 20;

            if (player.hp <= 0) {
              gameOver();
              return;
            }
          }
        }
      }

      // Gems (EXP Magnet)
      for (let i = gems.length - 1; i >= 0; i--) {
        const g = gems[i];
        const dist = Math.hypot(player.x - g.x, player.y - g.y);

        if (dist < player.magnetRange) {
          const angle = Math.atan2(player.y - g.y, player.x - g.x);
          const pullSpeed = 5 + (1 - dist / player.magnetRange) * 8;
          g.x += Math.cos(angle) * pullSpeed;
          g.y += Math.sin(angle) * pullSpeed;
        }

        if (dist < player.radius + g.radius) {
          AudioEngine.playGem();
          gainExp(g.exp);
          gems.splice(i, 1);
        }
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // Floating Texts
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y -= 0.7;
        ft.life -= 0.025;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Background grid
      ctx.strokeStyle = 'rgba(30, 41, 59, 0.4)';
      ctx.lineWidth = 1;
      const gridSize = 40;
      for (let x = 0; x < canvas.width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // Draw Gems
      gems.forEach(g => {
        ctx.save();
        ctx.fillStyle = g.color;
        ctx.shadowColor = g.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(g.x, g.y, g.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Draw Bullets
      bullets.forEach(b => {
        ctx.save();
        ctx.fillStyle = b.color;
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Draw Enemies
      enemies.forEach(e => {
        ctx.save();
        ctx.fillStyle = e.color;
        ctx.shadowColor = e.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
        ctx.fill();

        // Enemy HP mini bar
        if (e.hp < e.maxHp) {
          const barW = e.radius * 2;
          ctx.fillStyle = 'rgba(0,0,0,0.5)';
          ctx.fillRect(e.x - e.radius, e.y - e.radius - 8, barW, 4);
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(e.x - e.radius, e.y - e.radius - 8, barW * (e.hp / e.maxHp), 4);
        }
        ctx.restore();
      });

      // Draw Drones
      if (player.orbiters > 0) {
        const orbitAngle = (performance.now() * 0.003);
        const orbitDist = 55;
        for (let k = 0; k < player.orbiters; k++) {
          const a = orbitAngle + (k * (Math.PI * 2 / player.orbiters));
          const ox = player.x + Math.cos(a) * orbitDist;
          const oy = player.y + Math.sin(a) * orbitDist;

          ctx.save();
          ctx.fillStyle = '#a855f7';
          ctx.shadowColor = '#c084fc';
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.arc(ox, oy, 7, 0, Math.PI * 2);
          ctx.fill();

          // Beam link to player
          ctx.strokeStyle = 'rgba(168, 85, 247, 0.25)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(player.x, player.y);
          ctx.lineTo(ox, oy);
          ctx.stroke();
          ctx.restore();
        }
      }

      // Draw Player
      ctx.save();
      // 피격 무적 시간 동안 점멸 효과
      if (player.invulnerableTimer > 0 && Math.floor(performance.now() / 80) % 2 === 0) {
        ctx.globalAlpha = 0.4;
      }
      ctx.fillStyle = player.color;
      ctx.shadowColor = player.color;
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();

      // Gun Turret pointer
      const aimAngle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(player.x, player.y);
      ctx.lineTo(player.x + Math.cos(aimAngle) * (player.radius + 8), player.y + Math.sin(aimAngle) * (player.radius + 8));
      ctx.stroke();
      ctx.restore();

      // Draw Particles
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Draw Floating Texts
      floatingTexts.forEach(ft => {
        ctx.save();
        ctx.globalAlpha = ft.life;
        ctx.fillStyle = ft.color;
        ctx.font = 'bold 13px sans-serif';
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
      });
    }

    function gameLoop(timestamp) {
      const delta = timestamp - lastTime;
      lastTime = timestamp;

      update(delta);
      render();

      requestAnimationFrame(gameLoop);
    }

    // Event listeners
    startBtn.onclick = () => {
      AudioEngine.init();
      startScreen.classList.add('hidden');
      resetGame();
      gameState = 'PLAYING';
    };

    restartBtn.onclick = () => {
      AudioEngine.init();
      gameoverScreen.classList.add('hidden');
      resetGame();
      gameState = 'PLAYING';
    };

    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
